[project]
name = "shadow-mcp"
version = "0.1.0"
description = "Discover and risk-grade the MCP servers actually present on this machine. Local-first shadow-MCP inventory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saagar Patel" }]
dependencies = [
    "pydantic>=2",
    "rich>=13",
    "mcp>=1.27.0,<2",
    # Grading engines, resolved from PyPI. mcp-audits provides the static
    # capability analyzer (mcp_audit.api.scan_config_only_dict) and the public
    # connected scan engine (mcp_audit.engine.run_scan, added in 2.3);
    # mcp-trust provides the A-F danger-grade logic (mcp_trust.core.grading.grade)
    # and bundles the seed catalog we resolve slugs from. Both are imported
    # lazily (try/except ImportError) so a partial install degrades to
    # discovery-only rather than crashing — but a normal `uvx shadow-mcp`
    # install pulls them from PyPI and grades fully. Upper bounds: a major
    # version bump on either engine is a contract change that must fail at
    # resolve time, not mid-scan. The mcp cap stays <2 so a fresh uvx resolve
    # can't pull a v2 alpha that breaks the FastMCP API.
    "mcp-audits>=2.3,<3",
    "mcp-trust>=0.1.0,<1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shadow-mcp = "shadow_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures reproduce real `ps`/CLI output lines verbatim; wrapping them
# would corrupt the data under test.
"tests/**" = ["E501"]
