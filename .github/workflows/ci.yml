name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # All deps (incl. the mcp-audits + mcp-trust grading engines) now resolve
      # from PyPI, so a locked sync installs the reviewed grading path. The engine-backed
      # tests run for real here — config-only scans with no live targets. (The one
      # real-spawn connected test is gated behind SHADOW_MCP_RUN_CONNECT and stays
      # skipped.)
      - name: Install
        run: uv sync --locked --python 3.11

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test
        run: uv run --no-sync pytest
