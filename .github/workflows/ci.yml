name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # shadow-mcp grades by delegating to local sibling checkouts of the MCPAudit
      # and mcp-trust engines (the path-sourced `engines` group). Those don't exist
      # in CI, and `uv sync` builds the editable path-sources even when the group is
      # deselected. So install the package with --no-deps plus the runtime + dev
      # tools it needs; discovery + the local OWASP layer are fully exercised and the
      # engine-backed tests skip cleanly via importorskip.
      - name: Install (without local grading engines)
        run: |
          uv venv
          uv pip install pydantic rich "mcp>=1.27.0,<2" pytest ruff
          uv pip install --no-deps -e .

      # --no-sync: run against the env built above; never trigger an auto-sync that
      # would try to resolve the missing engine path-sources.
      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test
        run: uv run --no-sync pytest
