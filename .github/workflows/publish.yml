name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read   # checkout needs read on this (private) repo
      id-token: write  # OIDC trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"

      # Gate the release on the test suite: a broken tag must not publish. The
      # grading engines resolve from PyPI now, so the full suite (engine-backed
      # tests included) runs as the gate.
      - name: Test gate
        run: uv run pytest -q

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-10-05)
        with:
          packages-dir: dist/
